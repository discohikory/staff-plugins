name: AuthStaff
version: 1.0.0
main: com.discohikorybrs.authstaff.AuthStaff
api-version: '1.20'
author: Discohikorybrs
description: 2FA para staffs no premium con QR en mapa y menu de 6 digitos.
softdepend: [AuthMe, DiscoLogin]
commands:
  auth:
    description: Verificar tu codigo 2FA o abrir el menu.
    usage: /auth [codigo|menu|qr|reset <jugador>]
    permission: authstaff.use
permissions:
  authstaff.use:
    default: true
  authstaff.required:
    description: El jugador debe pasar el 2FA al entrar.
    default: op
  authstaff.admin:
    default: op
