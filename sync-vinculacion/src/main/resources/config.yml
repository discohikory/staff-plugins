discord:
  # Token del bot (¡no lo compartas!)
  token: "PEGA_AQUI_EL_TOKEN"
  # ID del servidor (guild)
  guild-id: "000000000000000000"
  # Formato del nick en Discord: {rango} y {mc} disponibles
