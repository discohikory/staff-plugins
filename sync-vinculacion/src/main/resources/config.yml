discord:
  # Token del bot (¡no lo compartas!)
  token: "PEGA_AQUI_EL_TOKEN"
  # ID del servidor (guild)
  guild-id: "000000000000000000"
  # Canal donde sale el selector de rangos (sincronizacion-discord)
  sync-channel-id: "1550726113662210159"
  # Canal por tipo de mensaje (ID). Vacío = usa sync-channel-id.
  channels:
    links: ""
    ranks: ""
    unlinks: ""
# Guardia 2FA por Discord (reemplazo del TOTP)
guard:
  enabled: true
  # Fallos antes de kick + demote (solo tras fallar verificación, nunca solo por IP)
  max-fails: 3
  # Webhook de alertas de fallos (vacío = solo consola)
  webhook-failed: ""
  # Rol a mencionar en la alerta
  ping-role-id: "1550507371514691635"
# Bedrock (móvil/IP cambiante): no se congela por IP, solo pide vínculo
bedrock-skip-ip-check: true
bedrock-prefix: "."
  # Roles a mencionar al vincular (ej: Management). Vacío = sin mención.
  link-ping-role-ids:
    - "1550507371514691635"
  # Formato del nick en Discord: {rango} y {mc} disponibles
  nickname-format: "{rango} {mc}"

# Escalera de rangos de MENOR a MAYOR. Deben existir en LuckPerms.
# discord-role-id: ID del rol de Discord correspondiente ("" = no tocar).
ladder:
  - { group: "helper", display: "Helper", discord-role-id: "" }
  - { group: "jr-mod", display: "Jr.Mod", discord-role-id: "" }
  - { group: "moderator", display: "Moderador", discord-role-id: "" }
  - { group: "sr-mod", display: "Sr. Mod", discord-role-id: "" }
  - { group: "jr-admin", display: "Jr.Admin", discord-role-id: "" }
  - { group: "admin", display: "Admin", discord-role-id: "" }
  - { group: "head-admin", display: "Head Admin", discord-role-id: "" }
  - { group: "manager", display: "Manager", discord-role-id: "" }
  - { group: "developer", display: "Developer", discord-role-id: "" }
  - { group: "control-tecnico", display: "Control Tecnico", discord-role-id: "" }
  - { group: "director-tecnico", display: "Director Tecnico", discord-role-id: "" }
  - { group: "head-manager", display: "Head Manager", discord-role-id: "" }
  - { group: "founder", display: "Founder", discord-role-id: "" }
  - { group: "owner", display: "Owner", discord-role-id: "" }
messages:
  prefix: "§6[Sync] §r"
  usage-link: "§eUso: /stafflinkdiscord <tu-id-de-discord>"
  bad-id: "§cEse ID no es válido (17-20 dígitos)."
  linked: "§a¡Cuenta vinculada con Discord! Revisa tus MD."
  need-link: "§cPrimero vincúlate con /stafflinkdiscord <tu-id>."
  need-link-many: "§c{jugador} no está vinculado. Que use /stafflinkdiscord <su-id>."
  already-linked: "§eTu cuenta ya está vinculada. Revisa tus MD."
  not-linked: "§c{jugador} no tiene vinculación."
  unlinked: "§a{jugador} desvinculado (roles de Discord retirados)."
  promoted: "§a{jugador} subió a {rango} (MC + Discord)."
  demoted: "§c{jugador} bajó a {rango} (MC + Discord)."
  top-rank: "§cYa está en el rango máximo."
  bottom-rank: "§cYa está en el rango mínimo."
  no-rank: "§cEse jugador no tiene ningún rango de la escalera."
  removed: "§c{jugador} perdió el rango {rango} (MC + Discord)."
